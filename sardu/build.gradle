buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        // AGP 9.4.1 on Gradle 9.6.1 / JDK 17 (compileSdk 37 needs AGP >= 9.1.1).
        classpath 'com.android.tools.build:gradle:9.4.1'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}
