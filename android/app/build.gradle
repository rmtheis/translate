apply plugin: 'com.android.application'

android {
    compileSdk = 37

    namespace = "com.qvyshift.translate"

    defaultConfig {
        applicationId "com.qvyshift.translate"
        // minSdk 21 is deliberate (wide device coverage). Never raise it.
        minSdk = 21
        targetSdk = 37
    }

    testOptions {
        // NativePipelineTest runs runPipeline, which logs: android.util.Log's stubs return
        // 0 instead of throwing.
        unitTests.returnDefaultValues = true
    }

    lint {
        // NewApi is fatal: a call above minSdk 21 without an SDK_INT check throws
        // NoSuchMethodError on older devices. Every release build runs lintVitalRelease,
        // which checks only fatal issues and fails the build on one only when abortOnError
        // is on. A full :app:lintRelease fails on plain errors too.
        abortOnError = true
        fatal += 'NewApi'
    }

    // CI populates app/upload.keystore from a base64 secret; local dev falls back to the
    // debug keystore so `./gradlew assembleRelease` still works without secrets set.
    signingConfigs {
        upload {
            def ks = file('upload.keystore')
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv('UPLOAD_KEYSTORE_PASSWORD') ?: ''
                keyAlias     System.getenv('UPLOAD_KEY_ALIAS') ?: ''
                keyPassword  System.getenv('UPLOAD_KEY_PASSWORD') ?: ''
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            // AGP 9 rejects proguard-android.txt (it carried -dontoptimize), so R8
            // now optimizes this app for the first time. Checked for 1.0.12: unit
            // tests, translation in several pairs, pair download/switch, upgrade
            // from 1.0.11 on the minified build.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-project.txt'
            signingConfig = file('upload.keystore').exists()
                ? signingConfigs.upload
                : signingConfigs.debug
        }
    }

    // Native binaries in jniLibs need to be extracted to disk so ProcessBuilder can exec them.
    // Otherwise AGP 8+ keeps them compressed inside the APK.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    // On-demand Play Asset Delivery modules. Each pair_<code> ships its
    // apertium-<pair>.jar and gets fetched lazily when the user picks that
    // language pair (see PairDownloadManager.java).
    assetPacks = [
        ':pair_arg_cat', ':pair_bel_rus', ':pair_cat_glg', ':pair_cat_ita',
        ':pair_cat_srd', ':pair_dan_nor', ':pair_eng_cat', ':pair_eng_spa',
        ':pair_fra_cat', ':pair_hbs_eng', ':pair_hbs_mkd', ':pair_mkd_eng',
        ':pair_nno_nob', ':pair_oci_cat', ':pair_oci_fra', ':pair_por_cat',
        ':pair_ron_cat', ':pair_rus_ukr', ':pair_sme_nob', ':pair_spa_arg',
        ':pair_spa_ast', ':pair_spa_cat', ':pair_spa_glg', ':pair_spa_ita',
        ':pair_srd_ita', ':pair_swe_dan', ':pair_swe_nor'
    ]
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.android.play:asset-delivery:2.2.2'
    implementation 'com.google.android.play:review:2.0.2'

    // Direct pins over the old fragment/activity that asset-delivery and material
    // drag in (fragment 1.1.0 is flagged as outdated by Play Console). These are the
    // newest releases that still declare minSdkVersion 21: fragment 1.9.0 and
    // activity 1.12.0 raised it to 23. Do NOT bump past them: minSdk stays 21.
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.activity:activity:1.11.0'

    testImplementation 'junit:junit:4.13.2'
}
