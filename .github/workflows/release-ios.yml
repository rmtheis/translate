name: Build and release (iOS)

# Decoupled from the Android workflow — same monthly cadence, separate
# pipeline. Assumes a future repo layout (github.com/rmtheis/translate-ios)
# where apertium-ios-native lives at native/ inside this repo, and
# ios/ is the Xcode project. The ODR-staging script lives at
# scripts/stage-pair-odrs.sh (analogue of Android's stage-pair-packs.sh).
#
# Builds with Xcode 27 (iOS 27 SDK) on the xcode-27 runner image.
#
# To try a change to this file, the natives or the app on the runner without
# publishing, dispatch it with build_only checked, or dispatch it from any
# branch other than master (which forces build-only): the run then ends after
# the "Archive Translate.ipa" job and the deploy job is skipped.

on:
  workflow_dispatch:
    inputs:
      force_publish:
        description: Upload to TestFlight/App Store even if no pair changed
        type: boolean
        default: false
      stock_notes:
        description: Use the stock "behind-the-scenes" release notes instead of the pair-inventory diff
        type: boolean
        default: false
      build_only:
        description: "Build only: natives, archive and export, then stop (no upload, no review submission, no commit)"
        type: boolean
        default: false
  schedule:
    # Monthly on the 2nd at 04:00 UTC — one day after Android, so their
    # prep-pair caches are already warm if we opt to reuse them.
    - cron: '0 4 2 * *'

# Only the deploy job may write to the repository (its bookkeeping commit);
# it asks for that itself. Every other job gets a read-only token.
permissions:
  contents: read

env:
  PACKAGE_NAME: com.qvyshift.translate
  # The Xcode major version every macOS job builds with: the newest RELEASED
  # Xcode of this major on the runner, picked by scripts/ci-select-xcode.sh,
  # which fails the job when there is none (it never falls back to an older
  # Xcode, and it skips betas). From April 2027 App Store Connect only accepts
  # uploads built with the iOS 27 SDK (upload warning 90725). The xcode-27
  # image is the only GitHub-hosted image with Xcode 27 (macos-15 and macos-26
  # stop at Xcode 26.x), so change this together with every `runs-on:` below.
  XCODE_MAJOR: '27'
  # 'true' ends the run after the build job: the deploy job (upload, App Store
  # version, release notes, review submission, bookkeeping commit) is skipped.
  # Set by the build_only dispatch input, and forced for every run that is not
  # on master, so a branch can prove a toolchain change on the runner but can
  # never publish. Scheduled runs are on master with no inputs, so they publish.
  BUILD_ONLY: ${{ inputs.build_only == true || github.ref != 'refs/heads/master' }}

jobs:
  # ---------------------------------------------------------------------------
  # 0. Schedule gate. workflow_dispatch always proceeds; scheduled (cron)
  #    runs are skipped until FIRST_RUN_DATE so the workflow doesn't
  #    auto-publish on top of a pending App Review. Bump FIRST_RUN_DATE if
  #    you need to re-pause cron-driven publishing later.
  # ---------------------------------------------------------------------------
  gate:
    name: Schedule gate
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        env:
          # YYYYMMDD; the cron starts firing on or after this date.
          FIRST_RUN_DATE: '20261201'
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(date -u +%Y%m%d)
          if [ "$today" -ge "$FIRST_RUN_DATE" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping scheduled iOS run before $FIRST_RUN_DATE (waiting on initial App Review approval)."
          fi

      # Says in the run's annotations whether this run can publish, and records
      # what each of the two build-only conditions evaluated to.
      - name: Run mode
        if: steps.check.outputs.proceed == 'true'
        env:
          BUILD_ONLY_INPUT: ${{ inputs.build_only == true }}
          OFF_MASTER: ${{ github.ref != 'refs/heads/master' }}
        run: |
          echo "event=${{ github.event_name }} ref=$GITHUB_REF build_only input=$BUILD_ONLY_INPUT off master=$OFF_MASTER BUILD_ONLY=$BUILD_ONLY"
          if [ "$BUILD_ONLY" = "true" ]; then
            echo "::notice::Build-only run: the deploy job is skipped. Nothing is uploaded, submitted for review or committed."
          else
            echo "::notice::Publishing run: the deploy job uploads to App Store Connect when a pair changed or force_publish is set."
          fi

  # ---------------------------------------------------------------------------
  # 1. Cross-compile the Apertium C++ toolchain into ApertiumCore.xcframework.
  #    Cached by the tree SHA of native/ and the Xcode build that compiled it,
  #    so this heavy step only reruns when the toolchain actually changes
  #    (and a cache made with another Xcode is never reused).
  # ---------------------------------------------------------------------------
  natives:
    name: Build ApertiumCore.xcframework
    runs-on: xcode-27
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode version
        id: xcode
        run: bash scripts/ci-select-xcode.sh "$XCODE_MAJOR"

      - id: key
        run: |
          sha=$(git rev-parse HEAD:ios/native)
          echo "cache_key=xcframework-${sha}-xcode-${{ steps.xcode.outputs.build }}" >> $GITHUB_OUTPUT

      - name: Cache xcframework
        id: cache
        uses: actions/cache@v5
        with:
          path: ios/native/ApertiumCore.xcframework
          key: ${{ steps.key.outputs.cache_key }}

      - if: steps.cache.outputs.cache-hit != 'true'
        name: Install toolchain
        run: brew install autoconf automake libtool pkg-config cmake ninja bison

      # Two slices are enough for App Store: ios-arm64 (device) and
      # ios-arm64-sim (Apple Silicon sim). x86_64-sim is optional; add
      # SLICE=ios-x86_64-sim build step if Intel Mac users complain.
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Cross-compile device slice
        working-directory: ios/native
        run: MAX_JOBS=2 ./build.sh all && ./build.sh wrappers

      - if: steps.cache.outputs.cache-hit != 'true'
        name: Cross-compile simulator slice
        working-directory: ios/native
        run: SLICE=ios-arm64-sim MAX_JOBS=2 ./build.sh all && SLICE=ios-arm64-sim ./build.sh wrappers

      - if: steps.cache.outputs.cache-hit != 'true'
        name: Wrap into xcframework
        working-directory: ios/native
        run: ./build.sh xcframework

      - uses: actions/upload-artifact@v6
        with:
          name: apertium-core-xcframework
          path: ios/native/ApertiumCore.xcframework
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Pull prebuilt pair data. Reuses android/native/prep-pair.sh unchanged —
  #    it fetches Debian .debs and repacks platform-neutral JARs. Same
  #    JARs Android consumes; the iOS stage script unpacks them into
  #    per-pair folder references.
  # ---------------------------------------------------------------------------
  pairs:
    name: Prep pair JARs
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    outputs:
      inventory_sha: ${{ steps.inv.outputs.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Enumerate enabled pairs from Swift catalog
        id: list
        run: |
          # Extract pkg names from PairCatalog.swift's `LanguagePair(pkg: "...")` entries.
          grep -oE 'pkg: "apertium-[a-z_]+-[a-z_]+"' \
            ios/Translate/PairCatalog.swift \
            | sed 's/pkg: "apertium-//; s/".*//' > /tmp/pairs.txt
          echo "count=$(wc -l < /tmp/pairs.txt | tr -d ' ')" >> $GITHUB_OUTPUT
          echo "--- pairs:"; cat /tmp/pairs.txt

      - name: Cache per-pair JARs
        id: cache
        uses: actions/cache@v5
        with:
          path: pair-jars
          key: ios-pairs-catalog-${{ hashFiles('ios/Translate/PairCatalog.swift', 'android/native/prep-pair.sh') }}-${{ github.run_id }}
          restore-keys: |
            ios-pairs-catalog-${{ hashFiles('ios/Translate/PairCatalog.swift', 'android/native/prep-pair.sh') }}-

      - name: Install prep-pair.sh deps
        run: sudo apt-get update && sudo apt-get install -y xz-utils

      - name: Fetch missing JARs
        env:
          PAIRS_DIR: ${{ github.workspace }}/pair-jars
        run: |
          mkdir -p pair-jars
          while read pair; do
            jar="pair-jars/apertium-${pair}.jar"
            if [ -f "$jar" ]; then echo "have $pair"; continue; fi
            bash android/native/prep-pair.sh "$pair"
          done < /tmp/pairs.txt

      # Every tool an offered direction's .mode runs needs a run_stage() case
      # in ios/native/wrappers/apertium_core.cpp ("unknown tool: lt-merge"
      # broke nob→nno through 1.0.6), and every option it passes must be one
      # tool_options() there knows and supports, or the direction fails at
      # runtime. Source-level check, so it runs here rather than after the
      # natives build.
      - name: Check offered directions' tools and options are wrapped
        run: python3 scripts/check-pair-tools.py --ios pair-jars

      - name: Compute pair inventory
        id: inv
        run: |
          python3 scripts/pair-inventory.py pair-jars > pair-inventory.json
          echo "sha=$(sha256sum pair-inventory.json | awk '{print $1}')" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v6
        with:
          name: ios-pairs
          path: |
            pair-jars
            pair-inventory.json
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Stage pair contents into the Xcode project, archive, export signed IPA.
  # ---------------------------------------------------------------------------
  build:
    name: Archive Translate.ipa
    runs-on: xcode-27
    needs: [natives, pairs]
    outputs:
      # Consumed by the deploy job so ASC operations target exactly the
      # build/version this archive produced — never "latest uploaded",
      # which can resolve to the previous release while the fresh upload
      # is still processing (that mis-pick 409'd the 2026-07 run).
      version_string: ${{ steps.bump.outputs.version_string }}
      bundle_version: ${{ steps.bump.outputs.bundle_version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: apertium-core-xcframework
          path: ios/native/ApertiumCore.xcframework

      - uses: actions/download-artifact@v7
        with:
          name: ios-pairs
          path: .

      - name: Select Xcode version
        run: bash scripts/ci-select-xcode.sh "$XCODE_MAJOR"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Unzip pair JARs into PairResources/
        run: bash scripts/stage-pair-odrs.sh pair-jars

      - name: Bump CFBundleVersion + CFBundleShortVersionString
        id: bump
        # Android bumps yyyymmddHH for versionCode; iOS uses that same
        # format for CFBundleVersion (App Store's build-number field).
        # CFBundleShortVersionString increments the patch component —
        # the deploy step commits the new value back to project.yml so
        # the next run picks up where this one left off.
        run: |
          current=$(grep -oE 'CFBundleShortVersionString: "[^"]+"' ios/project.yml \
            | head -1 | sed 's/.*"\([^"]*\)"/\1/')
          IFS='.' read -r maj min pat <<<"$current"
          new_name="$maj.$min.$((pat + 1))"
          build=$(date -u +%Y%m%d%H%M)
          sed -i '' "s|CFBundleShortVersionString: \"$current\"|CFBundleShortVersionString: \"$new_name\"|" ios/project.yml
          sed -i '' "s|CFBundleVersion: \"[0-9]*\"|CFBundleVersion: \"$build\"|" ios/project.yml
          echo "Built CFBundleShortVersionString=$new_name CFBundleVersion=$build"
          echo "version_string=$new_name" >> "$GITHUB_OUTPUT"
          echo "bundle_version=$build" >> "$GITHUB_OUTPUT"

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # --- Signing. Secrets expected:
      #   IOS_DISTRIBUTION_CERT_P12        — base64 of .p12 distribution cert
      #   IOS_DISTRIBUTION_CERT_PASSWORD   — password for the p12
      #   IOS_PROVISIONING_PROFILE         — base64 of App Store profile
      #
      # The keychain is a file with a full path ending in "-db", under
      # RUNNER_TEMP, and is added to the search list instead of being made the
      # default. On the xcode-27 image a keychain path without "-db" fails to
      # unlock (actions/runner-images#14837, open on 2026-11-19).
      - name: Import signing cert
        env:
          CERT_B64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12 }}
          CERT_PASS: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/ci.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 7200 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PASS" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH" > /dev/null
          rm -f "$RUNNER_TEMP/cert.p12"

          # Put the CI keychain first in the search list.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          IDENTITIES=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true)
          echo "$IDENTITIES" | sed -E 's/[0-9A-F]{40}/<sha1>/'
          if ! echo "$IDENTITIES" | grep -q '"Apple Distribution'; then
            echo "::warning::No valid Apple Distribution identity in the CI keychain. If Archive fails on signing, refresh the secrets with scripts/update_ios_signing_secrets.py."
          fi

      - name: Install provisioning profile
        env:
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/Translate.mobileprovision

      - name: Archive
        working-directory: ios
        run: |
          xcodebuild -project Translate.xcodeproj -scheme Translate \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Translate.xcarchive \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=X5S32CFST2 \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Translate App Store" \
            clean archive

          # Record what the archive was built with, and stop here (before the
          # deploy job can upload anything) if it is not the iOS 27 SDK or
          # later. "Select Xcode version" already guarantees this; the archive
          # itself is the proof.
          APP_PLIST=$(find build/Translate.xcarchive/Products/Applications -maxdepth 2 -name Info.plist | head -1)
          BUILT_SDK=$(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$APP_PLIST")
          BUILT_SDK_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :DTPlatformVersion' "$APP_PLIST")
          BUILT_XCODE=$(/usr/libexec/PlistBuddy -c 'Print :DTXcodeBuild' "$APP_PLIST")
          MIN_OS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PLIST")
          echo "Archive built with Xcode build $BUILT_XCODE, SDK $BUILT_SDK, minimum iOS $MIN_OS"
          echo "BUILT_WITH=Xcode build $BUILT_XCODE, SDK $BUILT_SDK, minimum iOS $MIN_OS" >> "$GITHUB_ENV"
          if [ "${BUILT_SDK_VERSION%%.*}" -lt "$XCODE_MAJOR" ]; then
            echo "::error::Archive was built with $BUILT_SDK; the iOS $XCODE_MAJOR SDK or later is required."
            exit 1
          fi

      - name: Export IPA (App Store)
        working-directory: ios
        run: |
          cat > /tmp/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>X5S32CFST2</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.qvyshift.translate</key>
              <string>Translate App Store</string>
            </dict>
            <key>uploadBitcode</key><false/>
            <key>compileBitcode</key><false/>
            <!-- Package all ODR tags with the archive for the App Store
                 CDN upload; TestFlight includes them too. -->
            <key>onDemandResourcesAssetPacksBaseURL</key>
            <string>https://apps.apple.com/ondemand/Translate/</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Translate.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath build/export
          # xcodebuild names the .ipa after CFBundleName ("Apertium
          # Translate.ipa"), not the scheme. Normalize to Translate.ipa
          # so downstream steps and artifact paths are simple.
          ls -la build/export
          ipa=$(ls build/export/*.ipa | head -1)
          mv "$ipa" build/export/Translate.ipa

      - uses: actions/upload-artifact@v6
        with:
          name: translate-ipa
          path: ios/build/export/Translate.ipa
          # A build-only IPA is never deployed; keep it just long enough to inspect.
          retention-days: ${{ env.BUILD_ONLY == 'true' && 1 || 14 }}

      # Build-only runs end with this job (see BUILD_ONLY in the top-level
      # env): the deploy job is skipped by its `if:`, and its first step also
      # refuses to run, so one mistaken condition cannot publish.
      - name: "Build-only run: stop before the deploy job"
        if: env.BUILD_ONLY == 'true'
        working-directory: ios
        run: |
          SIZE=$(du -h build/export/Translate.ipa | cut -f1)
          echo "Build-only run: exported Translate.ipa ($SIZE), $BUILT_WITH."
          echo "Nothing was uploaded, submitted for review or committed."
          {
            echo "### Translate: build only"
            echo "- Exported \`Translate.ipa\` ($SIZE), version ${{ steps.bump.outputs.version_string }} (${{ steps.bump.outputs.bundle_version }})"
            echo "- $BUILT_WITH"
            echo "- Nothing was uploaded, submitted for review or committed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi

  # ---------------------------------------------------------------------------
  # 4. Upload to App Store Connect via the API (no Fastlane, per
  #    CLAUDE.md). scripts/asc_upload.py wraps `xcrun altool` with an
  #    ES256 JWT minted from the .p8 private key — sibling of the
  #    Android Play Developer-API upload.
  # ---------------------------------------------------------------------------
  deploy:
    name: Upload to App Store Connect
    runs-on: xcode-27
    needs: [build, pairs]
    # Snapshot / versionName commit-back step pushes to master, so the
    # token needs write permission on the repo.
    permissions:
      contents: write
    # Both scheduled and manually-dispatched runs deploy. The `gate` job
    # blocks scheduled runs before FIRST_RUN_DATE — so May 2 cron skips
    # without ever reaching here, and June 2 onward auto-publishes monthly.
    # The pair-change gate inside this job (steps.gate.outputs.changed)
    # still no-ops uploads on quiet months unless force_publish=true.
    #
    # Build-only runs skip this whole job: only a run on master without the
    # build_only input gets here (same two conditions as BUILD_ONLY above).
    if: github.ref == 'refs/heads/master' && inputs.build_only != true
    steps:
      # Second, independent stop for build-only runs: this step reads the ref
      # and the dispatch input from the runner's own environment and the raw
      # event, not from the expressions used by the job's `if:`. If it fails,
      # no later step runs.
      - name: Refuse to publish from a build-only run
        env:
          BUILD_ONLY_EVENT_INPUT: ${{ github.event.inputs.build_only }}
        run: |
          if [ "$BUILD_ONLY" != "false" ] || [ "$GITHUB_REF" != "refs/heads/master" ] \
             || [ "$BUILD_ONLY_EVENT_INPUT" = "true" ]; then
            echo "::error::Refusing to publish: BUILD_ONLY=$BUILD_ONLY, ref=$GITHUB_REF, build_only input=$BUILD_ONLY_EVENT_INPUT. Only a run on master without build_only may deploy."
            exit 1
          fi

      - uses: actions/checkout@v5

      # altool (scripts/asc_upload.py) comes from the selected Xcode.
      - name: Select Xcode version
        run: bash scripts/ci-select-xcode.sh "$XCODE_MAJOR"

      - uses: actions/download-artifact@v7
        with:
          name: translate-ipa
          path: ipa

      - uses: actions/download-artifact@v7
        with:
          name: ios-pairs
          # ios-pairs artifact carries pair-jars/ + pair-inventory.json;
          # only the inventory is needed for the gate below.
          path: .

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install uploader deps
        run: python3 -m pip install pyjwt requests cryptography

      - name: Fetch prior pair inventory from repo
        run: cp .ci/prior-pair-inventory-ios.json prior.json 2>/dev/null || echo '[]' > prior.json

      - name: Gate on pair changes
        id: gate
        env:
          FORCE_PUBLISH: ${{ inputs.force_publish }}
        # Same logic as the Android release job: if nothing in
        # pair-inventory changed vs the last published snapshot, skip
        # the ASC upload (saves an App Review round-trip on quiet months).
        # force_publish=true overrides for app-code-only releases.
        run: |
          python3 - <<'PY'
          import json, os
          prior = {e["pair"]: e for e in json.load(open("prior.json"))}
          current = {e["pair"]: e for e in json.load(open("pair-inventory.json"))}
          added   = sorted(set(current) - set(prior))
          removed = sorted(set(prior) - set(current))
          changed = sorted(p for p in current if p in prior
                           and prior[p].get("sha256") != current[p].get("sha256"))
          forced = os.environ.get("FORCE_PUBLISH") == "true"
          any_change = bool(added or removed or changed) or forced
          print(f"added={len(added)} removed={len(removed)} changed={len(changed)} forced={forced}")
          if changed:
              for p in changed:
                  pv, cv = prior[p].get("version"), current[p].get("version")
                  print(f"  {p}: {pv or '?'} -> {cv or '?'}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"changed={'true' if any_change else 'false'}\n")
          PY

      - name: Skip notice
        if: steps.gate.outputs.changed != 'true'
        run: echo "::notice::No pair changed vs last release — not publishing."

      - name: Upload IPA to App Store Connect
        if: steps.gate.outputs.changed == 'true'
        env:
          ASC_KEY_ID:    ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_P8:        ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: python3 scripts/asc_upload.py ipa/Translate.ipa

      - name: Create App Store version (Apple does not auto-create it)
        if: steps.gate.outputs.changed == 'true'
        env:
          ASC_KEY_ID:         ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID:      ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_P8:             ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          ASC_BUNDLE_ID:      ${{ env.PACKAGE_NAME }}
          ASC_RELEASE_TYPE:   AFTER_APPROVAL
          ASC_VERSION_STRING: ${{ needs.build.outputs.version_string }}
        # Uploading a build does NOT create an App Store version row, so the
        # release-notes / description / submit steps would have nothing to act
        # on. Create it here (idempotent) with the exact version string the
        # archive job stamped into the IPA.
        run: |
          echo "Ensuring App Store version $ASC_VERSION_STRING exists"
          python3 scripts/asc_create_version.py

      - name: Generate inventory-diff release notes
        if: steps.gate.outputs.changed == 'true'
        # release-notes.py takes (prior, current) — same convention as
        # the Android workflow's whatsnew step. stock_notes=true swaps in the
        # house stock line instead. This file is the ENGLISH notes:
        # asc_release_notes.py posts it to the English localizations (en-US,
        # en-GB, en-AU, en-CA) and gives every other localization its own
        # stock line from ios/appstore/listings/<locale>.json, in both modes.
        # The pair diff is never translated, and English never lands in a
        # non-English locale.
        env:
          STOCK_NOTES: ${{ inputs.stock_notes }}
        run: |
          if [ "$STOCK_NOTES" = "true" ]; then
            echo "Behind-the-scenes changes to keep things running smoothly." > /tmp/release-notes.txt
          else
            python3 scripts/release-notes.py prior.json pair-inventory.json \
              > /tmp/release-notes.txt
          fi
          echo "--- release notes preview:"
          cat /tmp/release-notes.txt

      - name: Post release notes to ASC
        if: steps.gate.outputs.changed == 'true'
        env:
          ASC_KEY_ID:     ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID:  ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_P8:         ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          ASC_BUNDLE_ID:  ${{ env.PACKAGE_NAME }}
        # The whatsNew PATCH can only succeed after altool has fully
        # processed the upload and ASC has a version row for it. The
        # script queries the latest version and retries implicitly via
        # its find_app_id → latest_version_id lookup. One PATCH per
        # localization: the English notes for en-*, the listing's stock
        # line for the rest; a non-English locale with no listing JSON is
        # skipped with a warning annotation, and one whose whatsNew already
        # matches is left alone.
        run: python3 scripts/asc_release_notes.py /tmp/release-notes.txt

      - name: Refresh App Store description pair list
        if: steps.gate.outputs.changed == 'true'
        env:
          ASC_KEY_ID:     ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID:  ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_P8:         ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          ASC_BUNDLE_ID:  ${{ env.PACKAGE_NAME }}
        # Splices a fresh pair list into every localization's description
        # after its anchor line: "Language pairs:" in en-US (English names),
        # the listing's pairsHeading in the ios/appstore/listings/ locales
        # (CLDR names from scripts/language-names.json). Preambles are never
        # touched; a localization without its anchor is skipped with a
        # warning. Mirrors the Android store-description splice, with a
        # human-readable anchor line instead of HTML-comment START/END markers.
        run: python3 scripts/update-appstore-description.py pair-inventory.json

      - name: Submit version for App Store review (auto-release)
        if: steps.gate.outputs.changed == 'true'
        env:
          ASC_KEY_ID:       ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID:    ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_P8:           ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          ASC_BUNDLE_ID:    ${{ env.PACKAGE_NAME }}
          # AFTER_APPROVAL = the version goes live automatically the moment Apple
          # approves it. Set MANUAL here to hold a version for manual release.
          ASC_RELEASE_TYPE: AFTER_APPROVAL
          # Pin the exact build + version this run produced. Without the pin,
          # asc_resubmit.py falls back to "most recently uploaded processed
          # build" — which, while the fresh upload is still processing, is the
          # PREVIOUS release's build; attaching that 409s (2026-07-02 run).
          ASC_BUILD_VERSION:  ${{ needs.build.outputs.bundle_version }}
          ASC_VERSION_STRING: ${{ needs.build.outputs.version_string }}
        # This is the step that actually gets a release to end users: asc_resubmit.py
        # waits for the uploaded build to finish processing, attaches it to the App
        # Store version, sets release-after-approval, and submits it to Apple's
        # review queue. (Apple review is mandatory — there is no instant-live
        # equivalent of Play's production push; AFTER_APPROVAL is as close as it gets.)
        run: python3 scripts/asc_resubmit.py

      - name: Commit version bump + inventory snapshot
        if: steps.gate.outputs.changed == 'true'
        # Write the exact values the build job stamped into the IPA so the
        # committed project.yml agrees with what's on App Store Connect.
        env:
          NEW_NAME: ${{ needs.build.outputs.version_string }}
          NEW_BUILD: ${{ needs.build.outputs.bundle_version }}
        run: |
          sed -i '' "s|CFBundleShortVersionString: \"[^\"]*\"|CFBundleShortVersionString: \"$NEW_NAME\"|" ios/project.yml
          sed -i '' "s|CFBundleVersion: \"[0-9]*\"|CFBundleVersion: \"$NEW_BUILD\"|" ios/project.yml
          new_name="$NEW_NAME"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .ci
          cp pair-inventory.json .ci/prior-pair-inventory-ios.json
          git add .ci/prior-pair-inventory-ios.json ios/project.yml
          git diff --cached --quiet || {
            git commit -m "ci(ios): release $new_name — snapshot pair inventory + bump version [skip ci]"
            # Another push (a human, a concurrent run, or the parallel Android release)
            # may have advanced master while this job built. Rebase onto it and retry so
            # a race can't red-fail an already-successful App Store Connect upload.
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git push; then pushed=true; break; fi
              echo "push rejected (attempt $attempt) — rebasing onto origin/master"
              git pull --rebase origin master || { echo "::error::rebase hit a conflict; reconcile manually"; exit 1; }
            done
            [ "$pushed" = true ] || { echo "::error::could not push bookkeeping commit after 5 attempts"; exit 1; }
          }
